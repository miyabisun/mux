[package]
name = "mux"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "A small, safe tmux project launcher"
repository = "https://github.com/miyabisun/mux"
license = "MIT"
publish = false

[[bin]]
name = "mux"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
toml = "1.0"

[dev-dependencies]
serde_yaml = "0.9"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
